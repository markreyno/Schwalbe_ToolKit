<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f5f8fa">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Schwalbe ToolKit">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="stylesheet" href="/hub.css">
<title>Schwalbe ToolKit</title>
</head>
<body>
<header class="brand-bar">
  <div class="brand" aria-label="Schwalbe ToolKit home">
    <img class="brand-logo" src="/brand-logo.png" width="48" height="48" alt="">
    <div class="brand-text">SCHWALBE<small>TOOLKIT · CONNECT</small></div>
  </div>
</header>
<div class="shell">
  <header class="page-heading">
    <p class="eyebrow">PHONE ACCESS</p>
    <h1>Warehouse tools</h1>
    <p class="subtitle">Open Freight Pictures or PalletVision on this phone. Keep the desktop toolkit running on your network.</p>
  </header>
  <section id="picker-water-notifications" class="hub-notifications" hidden aria-hidden="true">
    <div class="hub-notifications-header">
      <h2>Picker watering</h2>
      <span class="hub-notifications-badge" id="picker-water-badge" hidden>0</span>
    </div>
    <ul id="picker-water-list" class="hub-notifications-list"></ul>
    <button type="button" id="picker-water-push-enable" class="hub-notifications-push" hidden>Enable push alerts</button>
    <p id="picker-water-push-status" class="hub-notifications-muted" hidden></p>
  </section>
  <div class="status-panel" id="status" role="status">
    <span class="status-dot" id="status-dot" aria-hidden="true"></span>
    <div>
      <div class="local-badge"><span aria-hidden="true"></span> Local workspace</div>
      <span id="status-text">Checking desktop connection…</span>
    </div>
  </div>
  <div class="tool-grid" id="tiles" aria-label="Warehouse tools"></div>
  <footer class="hub-footer">MADE FOR A SMOOTHER WORKDAY · SCHWALBE</footer>
</div>
<script src="/pwaInstallUi.js"></script>
<script src="/connectPwaMobile.js" defer></script>
</body>
</html>
